[main]
font=FantasqueSansM Nerd Font Mono:size=13
terminal=kitty
icons-enabled=yes
icon-theme=Adwaita
dpi-aware=no
prompt=" ❯ "
placeholder=Buscar…
width=64
lines=10
horizontal-pad=22
vertical-pad=14
inner-pad=6
line-height=26

[colors]
background={{colors.surface.default.hex_stripped}}99
text={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.primary.default.hex_stripped}}2e
selection-text={{colors.primary.default.hex_stripped}}ff
selection-match={{colors.primary.default.hex_stripped}}ff
border=ffffff66
prompt={{colors.primary.default.hex_stripped}}ff
placeholder={{colors.on_surface.default.hex_stripped}}73
counter={{colors.on_surface.default.hex_stripped}}73

[border]
width=1
radius=12
selection-radius=8

[dmenu]
mode=text
