# General config
bind r source-file ~/.tmux.conf \; display-message "config reloaded"

bind-key C-n command-prompt -p "New session name:" "new-session -s '%%'"

# cambiaso de sesiones
bind C-j display-popup -E "tmux list-sessions -F '#S' | fzf --reverse | xargs tmux switch-client -t"

# Posición del panel
set-option -g status-position top

# Paneles
set-option -g base-index 1
set-option -g pane-base-index 1

set -g mouse on
# tmux-256color (no screen-256color): screen-256color no entiende varias
# secuencias modernas y rompe el protocolo gráfico de kitty -> yazi se queda
# sin preview de imágenes/PDFs adentro de tmux. allow-passthrough + propagar
# TERM/TERM_PROGRAM es lo que kitty necesita para mandar imágenes a través de tmux.
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB,xterm-kitty:RGB'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Change access prefix
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

bind s split-window -h
bind x split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theming
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'

run-shell ~/.tmux/plugins/rose-pine/rose-pine.tmux

# Guardar/restaurar sesión (prefix + Ctrl-s guarda "last", prefix + Ctrl-r restaura "last")
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'

# Guardar/cargar layouts CON NOMBRE (sin auto-guardado, todo manual)
bind S command-prompt -p "Guardar layout como:" "run-shell '~/.tmux/scripts/save-named.sh %%'"
bind L display-popup -E "~/.tmux/scripts/load-named.sh"

# Initialize TMUX plugin manage
run '~/.tmux/plugins/tpm/tpm'


