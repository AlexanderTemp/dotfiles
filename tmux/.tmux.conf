bind r source-file ~/.tmux.conf \; display-message "config reloaded"

set -s command-alias[100] 'save-named=command-prompt -p "Save layout as:" "run-shell \"~/.tmux/scripts/save-named.sh %%\""'
set -s command-alias[101] 'load-named=display-popup -E "~/.tmux/scripts/load-named.sh"'
set -s command-alias[102] "pick-session=display-popup -E \"tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t\""
set -s command-alias[103] "new-named-session=command-prompt -p \"New session name:\" \"new-session -s '%%'\""

bind-key C-n new-named-session

bind C-j pick-session

set-option -g status-position top

set-option -g base-index 1
set-option -g pane-base-index 1

set -g mouse on
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB,xterm-kitty:RGB'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

bind s split-window -h -c "#{pane_current_path}"
bind c split-window -v -c "#{pane_current_path}"
bind v new-window -c "#{pane_current_path}"

setw -g mode-keys vi
bind x copy-mode
set -g history-limit 50000

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_window_separator '  '

run-shell ~/.tmux/plugins/rose-pine/rose-pine.tmux

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-save 'M-s'
set -g @resurrect-restore 'M-r'

set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'

bind S save-named
bind L load-named

run '~/.tmux/plugins/tpm/tpm'

set -g pane-border-lines single
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#6e6a86"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#6e6a86"

set -g message-style "fg=#6e6a86,bg=#191724,fill=#191724"
set -g message-command-style "fg=#191724,bg=#f6c177,fill=#f6c177"
