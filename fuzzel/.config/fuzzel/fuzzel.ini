# Tema kanagawabones, a juego con kitty/current-theme.conf y waybar/style.css
# (misma fuente que el resto del stack: FantasqueSansM Nerd Font Mono).
# Generado por matugen -- solo colores de acento; font/terminal/dpi-aware fijos.

[main]
font=FantasqueSansM Nerd Font Mono:size=13
terminal=kitty
icons-enabled=yes
icon-theme=Adwaita
dpi-aware=no
prompt=" ❯ "
placeholder=Buscar…
width=64
lines=10
horizontal-pad=22
vertical-pad=14
inner-pad=6
line-height=26

[colors]
background=1f1f28f0
text=ddd8bbff
match=ffb4aaff
selection=00000000
selection-text=ffb4aaff
selection-match=ffb4aaff
border=a08c8aff
prompt=7eb3c9ff
placeholder=6a6a58ff
counter=6a6a58ff

[border]
width=1
radius=0

[dmenu]
mode=text
