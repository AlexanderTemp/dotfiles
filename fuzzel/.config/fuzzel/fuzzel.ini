# Tema kanagawabones, a juego con kitty/current-theme.conf y waybar/style.css
# (misma fuente que el resto del stack: FantasqueSansM Nerd Font Mono).

[main]
font=FantasqueSansM Nerd Font Mono:size=13
terminal=kitty
icons-enabled=yes
icon-theme=Adwaita
dpi-aware=auto
prompt=" ❯ "
placeholder=Buscar…
width=38
lines=8
horizontal-pad=22
vertical-pad=14
inner-pad=6
line-height=26

[colors]
background=1f1f28f0
text=ddd8bbff
match=e5c283ff
selection=00000000
selection-text=e5c283ff
selection-match=e5c283ff
border=49473eff
prompt=7eb3c9ff
placeholder=6a6a58ff
counter=6a6a58ff

[border]
width=1
radius=12

[dmenu]
mode=text
